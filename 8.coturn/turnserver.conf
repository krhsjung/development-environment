# =============================================================================
# TURN/STUN 서버 설정 파일
# =============================================================================
# Coturn은 WebRTC 통신을 위한 TURN(Traversal Using Relays around NAT) 및
# STUN(Session Traversal Utilities for NAT) 서버입니다.
# NAT/방화벽 뒤에 있는 클라이언트 간 P2P 연결을 중계합니다.
# =============================================================================

# -----------------------------------------------------------------------------
# 리스닝 포트 설정
# -----------------------------------------------------------------------------

# TURN/STUN 리스너 포트 (UDP/TCP)
# 클라이언트가 STUN 바인딩 요청 및 TURN 할당 요청을 보내는 기본 포트입니다.
# 표준 포트: 3478 (IANA 지정)
listening-port=3478

# TLS/DTLS 리스닝 포트
# 보안 연결(TLS over TCP, DTLS over UDP)을 위한 포트입니다.
# 표준 포트: 5349 (IANA 지정)
# 프로덕션 환경에서는 반드시 TLS를 사용하세요.
tls-listening-port=5349

# -----------------------------------------------------------------------------
# 릴레이 포트 범위
# -----------------------------------------------------------------------------

# TURN 릴레이에 사용되는 UDP 포트 범위입니다.
# 클라이언트 간 미디어 스트림(오디오/비디오)이 이 포트를 통해 릴레이됩니다.
# 범위가 넓을수록 더 많은 동시 연결을 처리할 수 있습니다.
# 방화벽에서 이 범위의 UDP 포트를 열어야 합니다.
# (default values are 49152 and 65535)
min-port=49100
max-port=49200

# -----------------------------------------------------------------------------
# 네트워크 설정
# -----------------------------------------------------------------------------

# 외부(공인) IP 주소
# NAT 뒤에 서버가 있을 경우 반드시 설정해야 합니다.
# 클라이언트에게 알려줄 공인 IP 주소입니다.
# 형식: external-ip=공인IP/내부IP 또는 external-ip=공인IP
# 예시: external-ip=203.0.113.1/192.168.1.100
# DDNS 도메인이 아닌 실제 공인 IP를 사용해야 합니다.
# Coturn은 이 값을 DNS 조회하지 않고 그대로 클라이언트에게 전달합니다.
# DDNS IP가 변경되면 이 값도 업데이트해야 합니다.
# external-ip=your.public.ip.address/your.internal.ip.address


# 특정 인터페이스/IP에서만 리스닝
# 여러 네트워크 인터페이스가 있을 때 특정 IP에서만 수신하려면 설정합니다.
# 기본값: 모든 인터페이스(0.0.0.0)에서 리스닝
# listening-ip=0.0.0.0

# 릴레이에 사용할 IP 주소
# TURN 릴레이 트래픽에 사용할 IP를 지정합니다.
# relay-ip=192.168.1.100

# -----------------------------------------------------------------------------
# 도메인 및 서버 식별
# -----------------------------------------------------------------------------

# Realm (영역)
# 인증에 사용되는 도메인 이름입니다.
# 클라이언트가 인증할 때 이 realm을 사용합니다.
# 일반적으로 서비스 도메인과 동일하게 설정합니다.
realm=hsjung.asuscomm.com

# 서버 이름
# TURN 서버의 FQDN(완전한 도메인 이름)입니다.
# TLS 인증서의 CN(Common Name)과 일치해야 합니다.
server-name=hsjung.asuscomm.com

# -----------------------------------------------------------------------------
# 인증 설정
# -----------------------------------------------------------------------------

# 장기 자격 증명 메커니즘 (Long-Term Credential Mechanism)
# RFC 5389에 정의된 표준 인증 방식입니다.
# username과 password를 사용한 인증을 활성화합니다.
# WebRTC에서 TURN 서버 사용 시 필수입니다.
lt-cred-mech

# 정적 사용자 자격 증명
# 형식: user=사용자명:비밀번호
# 여러 사용자를 추가하려면 여러 줄로 작성합니다.
# 주의: 설정 파일에 평문 비밀번호가 저장되므로 파일 권한에 주의하세요.
# 프로덕션 환경에서는 static-auth-secret을 사용한 REST API 방식을 권장합니다.
# REST API 방식 사용 시 이 설정은 주석 처리하세요.
# user=webrtc:secretpassword
# user=testuser:testpass

# 사용자 데이터베이스 파일
# 별도의 파일에서 사용자 정보를 읽어옵니다.
# 파일 형식: 사용자명:realm:MD5해시 또는 사용자명:비밀번호
# userdb=/etc/coturn/turnusers.txt

# 시간 제한 자격 증명 (Time-Limited Credentials)
# REST API를 통해 임시 자격 증명을 발급할 때 사용합니다.
# 정적 인증 비밀키 (TURN REST API용)
# 이 키로 HMAC-SHA1 기반 임시 credential을 생성합니다.
# static-auth-secret=YOUR_SECRET_KEY

# -----------------------------------------------------------------------------
# 로깅 설정
# -----------------------------------------------------------------------------

# 로그 파일 경로
# TURN 서버의 모든 활동이 이 파일에 기록됩니다.
# Docker에서는 stdout으로 출력하려면 이 옵션을 제거하세요.
log-file=/var/log/coturn/turnserver.log

# 상세 로깅 활성화
# 디버깅 시 유용합니다. 프로덕션에서는 비활성화를 권장합니다.
verbose

# Syslog 사용
# 시스템 로그 데몬으로 로그를 전송합니다.
# syslog

# 로그에 사용자명 표시하지 않음 (개인정보 보호)
# no-stdout-log

# -----------------------------------------------------------------------------
# 보안 설정
# -----------------------------------------------------------------------------

# STUN 메시지에 fingerprint 속성 추가
# RFC 5389 권장사항입니다. 메시지 무결성 검증에 사용됩니다.
fingerprint

# 멀티캐스트 피어 비활성화
# 보안상 멀티캐스트 주소로의 릴레이를 차단합니다.
no-multicast-peers

# CLI(명령줄 인터페이스) 비활성화
# 런타임에 서버를 제어하는 CLI를 비활성화합니다.
# 보안상 프로덕션에서는 비활성화를 권장합니다.
no-cli

# STUN 전용 모드 (TURN 비활성화)
# STUN 서버로만 동작하고 TURN 릴레이 기능을 비활성화합니다.
# stun-only

# 평문 TCP 릴레이 비활성화
# 보안을 위해 TLS만 허용하려면 활성화합니다.
# no-tcp-relay

# UDP 릴레이 비활성화
# TCP/TLS만 사용하려면 활성화합니다.
# no-udp-relay

# -----------------------------------------------------------------------------
# TLS/DTLS 인증서 설정
# -----------------------------------------------------------------------------

# TLS 인증서 파일 경로 (PEM 형식)
# Let's Encrypt 등에서 발급받은 인증서를 사용합니다.
# cert=/etc/coturn/cert.pem

# TLS 개인키 파일 경로 (PEM 형식)
# pkey=/etc/coturn/privkey.pem

# CA 인증서 파일 (클라이언트 인증서 검증용)
# CA-file=/etc/coturn/ca.pem

# TLS 암호화 스위트 설정
# 보안 수준에 따라 허용할 암호화 방식을 지정합니다.
# cipher-list="ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"

# 최소 TLS 버전 (1.0, 1.1, 1.2, 1.3)
# 보안을 위해 TLS 1.2 이상을 권장합니다.
# tls-min-version=1.2

# -----------------------------------------------------------------------------
# 접근 제어 (피어 IP 제한)
# -----------------------------------------------------------------------------

# 릴레이 대상에서 제외할 IP 대역
# 내부 네트워크로의 릴레이를 차단하여 SSRF 공격을 방지합니다.
# 프라이빗 IP 대역을 차단하는 것이 보안상 권장됩니다.
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
# denied-peer-ip=127.0.0.0-127.255.255.255

# 릴레이를 허용할 IP 대역
# 화이트리스트 방식으로 특정 IP만 허용합니다.
# allowed-peer-ip=203.0.113.0-203.0.113.255

# -----------------------------------------------------------------------------
# 성능 및 제한 설정
# -----------------------------------------------------------------------------

# 사용자당 최대 할당(allocation) 수
# 한 사용자가 생성할 수 있는 TURN 세션 수를 제한합니다.
# user-quota=12

# 전체 최대 할당 수
# 서버 전체의 총 TURN 세션 수를 제한합니다.
# total-quota=1200

# 릴레이당 최대 BPS (Bits Per Second)
# 단일 세션의 대역폭을 제한합니다.
# max-bps=0

# 전체 최대 BPS
# 서버 전체의 총 대역폭을 제한합니다.
# bps-capacity=0

# 세션 타임아웃 (초)
# 비활성 세션이 자동으로 종료되는 시간입니다.
# stale-nonce=600

# -----------------------------------------------------------------------------
# 기타 설정
# -----------------------------------------------------------------------------

# 데몬 모드로 실행 (백그라운드)
# Docker에서는 일반적으로 포그라운드로 실행하므로 비활성화합니다.
# daemon

# PID 파일 경로
# pidfile=/var/run/coturn/turnserver.pid

# 프로세스 사용자/그룹 변경
# 보안을 위해 root가 아닌 사용자로 실행합니다.
# proc-user=turnserver
# proc-group=turnserver
